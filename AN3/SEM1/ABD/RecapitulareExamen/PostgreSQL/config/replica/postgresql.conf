# ============================================================
# PostgreSQL Configuration - REPLICA SERVER
# ============================================================
# This configuration is for streaming replica (standby) servers.
# Replicas receive WAL data from the primary and apply it.
# They can also serve read-only queries (hot standby).
# ============================================================

# ------------------------------------------------------------
# CONNECTION SETTINGS
# ------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100

# ------------------------------------------------------------
# STANDBY SETTINGS
# ------------------------------------------------------------
# Enable hot standby - allows read queries on this replica
# Without this, replicas would reject all connections
hot_standby = on

# Send feedback to primary about replica's state
# Helps primary know what WAL can be safely recycled
hot_standby_feedback = on

# ------------------------------------------------------------
# WAL SETTINGS (Must match or exceed primary)
# ------------------------------------------------------------
# These must be set in case this replica is promoted to primary
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1GB

# ------------------------------------------------------------
# RECOVERY SETTINGS
# ------------------------------------------------------------
# Maximum time to wait for WAL data from primary
# If exceeded, replica will try to reconnect
wal_receiver_timeout = 60s

# Delay before applying received WAL (useful for disaster recovery)
# 0 = apply immediately (real-time replication)
recovery_min_apply_delay = 0

# ------------------------------------------------------------
# PRIMARY CONNECTION INFO
# ------------------------------------------------------------
# This is configured via standby.signal and postgresql.auto.conf
# during pg_basebackup initialization (see init-replica.sh)

# ------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'ddl'

# ------------------------------------------------------------
# MEMORY SETTINGS
# ------------------------------------------------------------
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
