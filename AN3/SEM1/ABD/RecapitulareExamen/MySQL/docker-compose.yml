services:

  db-master:
    image: mariadb:latest
    container_name: imdb_master
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: toor
      MARIADB_DATABASE: imdb
      MARIADB_USER: user_imdb
      MARIADB_PASSWORD: user_pass
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-do-db=imdb
    ports:
      - "3308:3306"              
    volumes:
      - master_data:/var/lib/mysql
    networks:
      - imdb_net

  
  db-slave1:
    image: mariadb:latest
    container_name: imdb_slave1
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: toor
      MARIADB_DATABASE: imdb
      MARIADB_USER: user_imdb
      MARIADB_PASSWORD: user_pass
    command: >
      --server-id=2
      --log-bin=mysql-bin
      --relay-log=relay-bin
      --read-only=ON
    depends_on:
      - db-master
    ports:
      - "3309:3306"              
    volumes:
      - slave1_data:/var/lib/mysql
    networks:
      - imdb_net

  db-slave2:
    image: mariadb:latest
    container_name: imdb_slave2
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: toor
      MARIADB_DATABASE: imdb
      MARIADB_USER: user_imdb
      MARIADB_PASSWORD: user_pass
    command: >
      --server-id=3
      --log-bin=mysql-bin
      --relay-log=relay-bin
      --read-only=ON
    depends_on:
      - db-master
    ports:
      - "3310:3306"              
    volumes:
      - slave2_data:/var/lib/mysql
    networks:
      - imdb_net

  adminer:
    image: adminer:latest
    container_name: imdb_adminer
    restart: always
    depends_on:
      - db-master
    ports:
      - 8080:8080              
    environment:
      ADMINER_DEFAULT_SERVER: db-master
    networks:
      - imdb_net
volumes:
  master_data:
  slave1_data:
  slave2_data:

networks:
  imdb_net:
    driver: bridge