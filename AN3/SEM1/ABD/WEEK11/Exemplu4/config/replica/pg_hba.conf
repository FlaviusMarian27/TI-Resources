# ============================================================
# PostgreSQL Host-Based Authentication - REPLICA SERVER
# ============================================================
# Replicas accept READ-ONLY queries when in hot standby mode.
# Write operations will fail with an error.
# ============================================================

# Local connections
local   all             all                                     trust

# Host connections
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
host    all             all             172.0.0.0/8             scram-sha-256
host    all             all             0.0.0.0/0               scram-sha-256

# Replication (in case this replica becomes primary)
local   replication     all                                     trust
host    replication     replicator      172.0.0.0/8             scram-sha-256
host    replication     replicator      0.0.0.0/0               scram-sha-256
