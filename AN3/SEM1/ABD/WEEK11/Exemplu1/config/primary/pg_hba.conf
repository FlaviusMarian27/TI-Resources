# ============================================================
# PostgreSQL Host-Based Authentication - PRIMARY SERVER
# ============================================================
# This file controls:
# - WHO can connect
# - FROM WHERE they can connect  
# - HOW they authenticate
# - WHAT databases they can access
#
# Format: TYPE  DATABASE  USER  ADDRESS  METHOD
# ============================================================

# ------------------------------------------------------------
# LOCAL CONNECTIONS (Unix socket)
# ------------------------------------------------------------
# Allow local connections without password (trust)
# Used by postgres user for administrative tasks
local   all             all                                     trust

# ------------------------------------------------------------
# HOST CONNECTIONS (TCP/IP)
# ------------------------------------------------------------
# Allow all users to connect from localhost with password
host    all             all             127.0.0.1/32            scram-sha-256

# Allow IPv6 localhost
host    all             all             ::1/128                 scram-sha-256

# Allow connections from Docker network (172.x.x.x)
# This is necessary for our replicas and any client containers
host    all             all             172.0.0.0/8             scram-sha-256

# Allow connections from any IP (for testing)
# In production, restrict this to specific IPs!
host    all             all             0.0.0.0/0               scram-sha-256

# ------------------------------------------------------------
# REPLICATION CONNECTIONS
# ------------------------------------------------------------
# These lines allow the replication user to connect
# for streaming replication purposes.
#
# TYPE=replication means this is a replication connection
# DATABASE=replication is a special keyword, not a database name
# ------------------------------------------------------------

# Local replication (rarely used but good to have)
local   replication     all                                     trust

# Replication from Docker network
host    replication     replicator      172.0.0.0/8             scram-sha-256

# Replication from any IP (for testing)
# In production, restrict to replica IPs only!
host    replication     replicator      0.0.0.0/0               scram-sha-256
