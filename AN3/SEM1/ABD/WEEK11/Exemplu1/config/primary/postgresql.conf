# ============================================================
# PostgreSQL Configuration - PRIMARY SERVER
# ============================================================
# This configuration enables streaming replication.
# The primary accepts connections from replicas and streams
# WAL (Write-Ahead Log) data to them.
# ============================================================

# ------------------------------------------------------------
# CONNECTION SETTINGS
# ------------------------------------------------------------
# Listen on all network interfaces (required for Docker)
listen_addresses = '*'

# Default port
port = 5432

# Maximum concurrent connections
# Replicas count against this limit too!
max_connections = 100

# ------------------------------------------------------------
# WRITE-AHEAD LOG (WAL) SETTINGS
# ------------------------------------------------------------
# WAL level must be 'replica' or 'logical' for replication
# 'replica' = streaming replication (what we need)
# 'logical' = logical replication (more advanced)
wal_level = replica

# Maximum number of concurrent WAL sender processes
# One per replica + a few extra for safety
# We have 3 replicas, so 10 is plenty
max_wal_senders = 10

# Number of replication slots to reserve
# Slots ensure WAL isn't deleted before replicas receive it
# One slot per replica
max_replication_slots = 10

# ------------------------------------------------------------
# WAL ARCHIVING (Optional but recommended)
# ------------------------------------------------------------
# Keep WAL segments for replicas that fall behind
# This sets how much WAL to retain
# 1GB is good for testing; production may need more
wal_keep_size = 1GB

# ------------------------------------------------------------
# REPLICATION SETTINGS
# ------------------------------------------------------------
# Hot standby allows replicas to accept read queries
# This is set on primary so replicas inherit it
hot_standby = on

# Feedback from replicas (helps primary manage WAL)
hot_standby_feedback = on

# ------------------------------------------------------------
# SYNCHRONOUS REPLICATION (Disabled for this tutorial)
# ------------------------------------------------------------
# Uncomment to enable synchronous replication:
# synchronous_commit = on
# synchronous_standby_names = 'ANY 1 (pg_replica1, pg_replica2, pg_replica3)'

# ------------------------------------------------------------
# LOGGING (Useful for debugging)
# ------------------------------------------------------------
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'ddl'
log_replication_commands = on

# ------------------------------------------------------------
# MEMORY SETTINGS (Reasonable defaults)
# ------------------------------------------------------------
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
