upstream drupal {
  zone drupal 64k;
  server drupal1:80;
  server drupal2:80;
  server drupal3:80;
}
server {
  listen 80;
  location / {
    proxy_pass http://drupal;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_next_upstream error timeout http_502 http_503;
    add_header X-Served-By $upstream_addr always;
  }
}
