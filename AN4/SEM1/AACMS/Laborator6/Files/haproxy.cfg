global
    maxconn 100

defaults
    mode tcp
    timeout connect 5s
    timeout client 30m
    timeout server 30m

frontend pg
    bind *:5432
    default_backend pg_nodes

backend pg_nodes
    option pgsql-check user drupal
    server primary db-primary:5432 check inter 2s fall 2 rise 2
    server replica db-replica:5432 check inter 2s fall 2 rise 2 backup
