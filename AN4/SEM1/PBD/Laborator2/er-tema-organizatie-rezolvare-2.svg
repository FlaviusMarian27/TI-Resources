    <text x="48" y="803" font-size="14" font-weight="bold" fill="#00804a">Rezolvare: se adaugă relația Companie 1:N Angajat, iar Grup 1:N Angajat rămâne</text>
    <text x="48" y="824" font-size="14" fill="#333">Acum se știe din ce companie e angajatul. Grup 1:N Companie rămâne valid: pot exista companii fără niciun angajat.</text>
    <text x="48" y="845" font-size="14" fill="#333">Atenție: grupul angajatului se poate afla pe două căi, deci trebuie să coincidă cu grupul companiei lui (regulă de consistență).</text>

