<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1250" viewBox="0 0 820 1250" font-family="Arial, Helvetica, sans-serif">
  <rect x="2" y="2" width="816" height="1246" rx="12" fill="#ffffff" stroke="#d0d0d0"/>

  <!-- A. Componente de baza -->
  <text x="30" y="34" font-size="17" font-weight="bold" fill="#333">1. Componentele de bază</text>
  <rect x="80" y="55" width="170" height="60" fill="none" stroke="#1f5fae" stroke-width="3"/>
  <ellipse cx="410" cy="85" rx="90" ry="32" fill="none" stroke="#c00000" stroke-width="3"/>
  <polygon points="540,85 640,45 740,85 640,125" fill="none" stroke="#00a550" stroke-width="3"/>
  <text x="165" y="145" font-size="15" text-anchor="middle" fill="#333">Entitate (dreptunghi)</text>
  <text x="410" y="145" font-size="15" text-anchor="middle" fill="#333">Atribut (oval)</text>
  <text x="640" y="145" font-size="15" text-anchor="middle" fill="#333">Relație (romb)</text>

  <!-- B. Entitate slaba -->
  <line x1="30" y1="170" x2="790" y2="170" stroke="#e5e5e5"/>
  <text x="30" y="200" font-size="17" font-weight="bold" fill="#333">2. Entitate slabă = dreptunghi dublu</text>
  <rect x="120" y="220" width="190" height="64" fill="none" stroke="#1f5fae" stroke-width="3"/>
  <rect x="127" y="227" width="176" height="50" fill="none" stroke="#1f5fae" stroke-width="3"/>
  <text x="215" y="257" font-size="15" text-anchor="middle" fill="#333">Cont bancar</text>
  <line x1="310" y1="252" x2="500" y2="252" stroke="#333" stroke-width="1.5"/>
  <rect x="500" y="220" width="170" height="64" fill="none" stroke="#1f5fae" stroke-width="3"/>
  <text x="585" y="257" font-size="15" text-anchor="middle" fill="#333">Bancă</text>
  <text x="400" y="312" font-size="14" text-anchor="middle" fill="#555">Cont bancar nu poate fi identificat fără să știi banca de care aparține</text>

  <!-- C. Atribute -->
  <line x1="30" y1="335" x2="790" y2="335" stroke="#e5e5e5"/>
  <text x="30" y="365" font-size="17" font-weight="bold" fill="#333">3. Atributele entității Student</text>
  <rect x="50" y="480" width="130" height="60" fill="none" stroke="#1f5fae" stroke-width="3"/>
  <text x="115" y="516" font-size="15" text-anchor="middle" fill="#333">Student</text>

  <g stroke="#333" stroke-width="1.3">
    <line x1="180" y1="510" x2="345" y2="410"/>
    <line x1="180" y1="510" x2="345" y2="472"/>
    <line x1="180" y1="510" x2="345" y2="534"/>
    <line x1="180" y1="510" x2="345" y2="596"/>
    <line x1="180" y1="510" x2="345" y2="658"/>
  </g>

  <ellipse cx="430" cy="410" rx="85" ry="26" fill="#fff" stroke="#c00000" stroke-width="3"/>
  <text x="430" y="415" font-size="15" text-anchor="middle" fill="#333" text-decoration="underline">Nr. matricol</text>
  <text x="540" y="415" font-size="14" fill="#555">cheie: textul e subliniat</text>

  <ellipse cx="430" cy="472" rx="85" ry="26" fill="#fff" stroke="#c00000" stroke-width="3"/>
  <text x="430" y="477" font-size="15" text-anchor="middle" fill="#333">Nume</text>
  <text x="540" y="477" font-size="14" fill="#555">atribut simplu</text>

  <ellipse cx="430" cy="534" rx="85" ry="26" fill="#fff" stroke="#c00000" stroke-width="3"/>
  <ellipse cx="430" cy="534" rx="77" ry="19" fill="none" stroke="#c00000" stroke-width="3"/>
  <text x="430" y="539" font-size="15" text-anchor="middle" fill="#333">Nr. telefon</text>
  <text x="540" y="539" font-size="14" fill="#555">multivaloare: oval dublu</text>

  <ellipse cx="430" cy="596" rx="85" ry="26" fill="#fff" stroke="#c00000" stroke-width="3"/>
  <text x="430" y="601" font-size="15" text-anchor="middle" fill="#333">Data nașterii</text>
  <text x="540" y="601" font-size="14" fill="#555">atribut simplu (din el derivă vârsta)</text>

  <ellipse cx="430" cy="658" rx="85" ry="26" fill="#fff" stroke="#c00000" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="430" y="663" font-size="15" text-anchor="middle" fill="#333">Vârsta</text>
  <text x="540" y="663" font-size="14" fill="#555">derivat: oval punctat</text>

  <!-- D. Atribut compus -->
  <line x1="30" y1="710" x2="790" y2="710" stroke="#e5e5e5"/>
  <text x="30" y="740" font-size="17" font-weight="bold" fill="#333">4. Atribut compus (în PDF e doar descris, nu desenat)</text>
  <ellipse cx="190" cy="815" rx="80" ry="28" fill="#fff" stroke="#c00000" stroke-width="3"/>
  <text x="190" y="820" font-size="15" text-anchor="middle" fill="#333">Adresa</text>
  <g stroke="#333" stroke-width="1.3">
    <line x1="270" y1="815" x2="390" y2="768"/>
    <line x1="270" y1="815" x2="390" y2="815"/>
    <line x1="270" y1="815" x2="390" y2="862"/>
  </g>
  <ellipse cx="450" cy="768" rx="60" ry="19" fill="#fff" stroke="#c00000" stroke-width="3"/>
  <text x="450" y="773" font-size="14" text-anchor="middle" fill="#333">țara</text>
  <ellipse cx="450" cy="815" rx="60" ry="19" fill="#fff" stroke="#c00000" stroke-width="3"/>
  <text x="450" y="820" font-size="14" text-anchor="middle" fill="#333">strada</text>
  <ellipse cx="450" cy="862" rx="60" ry="19" fill="#fff" stroke="#c00000" stroke-width="3"/>
  <text x="450" y="867" font-size="14" text-anchor="middle" fill="#333">numărul</text>
  <text x="540" y="820" font-size="14" fill="#555">combinație de alte atribute</text>

  <!-- E. Relatii -->
  <line x1="30" y1="895" x2="790" y2="895" stroke="#e5e5e5"/>
  <text x="30" y="925" font-size="17" font-weight="bold" fill="#333">5. Tipuri de relații</text>

  <g>
    <rect x="80" y="956" width="150" height="48" fill="none" stroke="#1f5fae" stroke-width="3"/>
    <text x="155" y="985" font-size="15" text-anchor="middle" fill="#333">Persoană</text>
    <line x1="230" y1="980" x2="330" y2="980" stroke="#333" stroke-width="1.3"/>
    <polygon points="330,980 410,948 490,980 410,1012" fill="none" stroke="#00a550" stroke-width="3"/>
    <text x="410" y="985" font-size="15" text-anchor="middle" fill="#333">are</text>
    <line x1="490" y1="980" x2="590" y2="980" stroke="#333" stroke-width="1.3"/>
    <rect x="590" y="956" width="150" height="48" fill="none" stroke="#1f5fae" stroke-width="3"/>
    <text x="665" y="985" font-size="15" text-anchor="middle" fill="#333">Pașaport</text>
    <text x="246" y="972" font-size="15" font-weight="bold" fill="#333">1</text>
    <text x="574" y="972" font-size="15" font-weight="bold" text-anchor="end" fill="#333">1</text>
    <text x="752" y="985" font-size="14" fill="#555">1:1</text>
  </g>

  <g>
    <rect x="80" y="1026" width="150" height="48" fill="none" stroke="#1f5fae" stroke-width="3"/>
    <text x="155" y="1055" font-size="15" text-anchor="middle" fill="#333">Client</text>
    <line x1="230" y1="1050" x2="330" y2="1050" stroke="#333" stroke-width="1.3"/>
    <polygon points="330,1050 410,1018 490,1050 410,1082" fill="none" stroke="#00a550" stroke-width="3"/>
    <text x="410" y="1055" font-size="15" text-anchor="middle" fill="#333">plasează</text>
    <line x1="490" y1="1050" x2="590" y2="1050" stroke="#333" stroke-width="1.3"/>
    <rect x="590" y="1026" width="150" height="48" fill="none" stroke="#1f5fae" stroke-width="3"/>
    <text x="665" y="1055" font-size="15" text-anchor="middle" fill="#333">Comandă</text>
    <text x="246" y="1042" font-size="15" font-weight="bold" fill="#333">1</text>
    <text x="574" y="1042" font-size="15" font-weight="bold" text-anchor="end" fill="#333">N</text>
    <text x="752" y="1055" font-size="14" fill="#555">1:N</text>
  </g>

  <g>
    <rect x="80" y="1096" width="150" height="48" fill="none" stroke="#1f5fae" stroke-width="3"/>
    <text x="155" y="1125" font-size="15" text-anchor="middle" fill="#333">Student</text>
    <line x1="230" y1="1120" x2="330" y2="1120" stroke="#333" stroke-width="1.3"/>
    <polygon points="330,1120 410,1088 490,1120 410,1152" fill="none" stroke="#00a550" stroke-width="3"/>
    <text x="410" y="1125" font-size="15" text-anchor="middle" fill="#333">înrolat</text>
    <line x1="490" y1="1120" x2="590" y2="1120" stroke="#333" stroke-width="1.3"/>
    <rect x="590" y="1096" width="150" height="48" fill="none" stroke="#1f5fae" stroke-width="3"/>
    <text x="665" y="1125" font-size="15" text-anchor="middle" fill="#333">Curs</text>
    <text x="246" y="1112" font-size="15" font-weight="bold" fill="#333">N</text>
    <text x="574" y="1112" font-size="15" font-weight="bold" text-anchor="end" fill="#333">1</text>
    <text x="752" y="1125" font-size="14" fill="#555">N:1</text>
  </g>

  <g>
    <rect x="80" y="1166" width="150" height="48" fill="none" stroke="#1f5fae" stroke-width="3"/>
    <text x="155" y="1195" font-size="15" text-anchor="middle" fill="#333">Angajat</text>
    <line x1="230" y1="1190" x2="330" y2="1190" stroke="#333" stroke-width="1.3"/>
    <polygon points="330,1190 410,1158 490,1190 410,1222" fill="none" stroke="#00a550" stroke-width="3"/>
    <text x="410" y="1195" font-size="15" text-anchor="middle" fill="#333">e asociat</text>
    <line x1="490" y1="1190" x2="590" y2="1190" stroke="#333" stroke-width="1.3"/>
    <rect x="590" y="1166" width="150" height="48" fill="none" stroke="#1f5fae" stroke-width="3"/>
    <text x="665" y="1195" font-size="15" text-anchor="middle" fill="#333">Proiect</text>
    <text x="246" y="1182" font-size="15" font-weight="bold" fill="#333">N</text>
    <text x="574" y="1182" font-size="15" font-weight="bold" text-anchor="end" fill="#333">N</text>
    <text x="752" y="1195" font-size="14" fill="#555">N:N</text>
  </g>
</svg>
